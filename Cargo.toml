[workspace]
members = ["agent-sdk", "app-sdk", "provider-sdk", "storage-sdk", "tool-sdk"]
default-members = ["agent-sdk", "app-sdk", "provider-sdk", "storage-sdk", "tool-sdk"]
resolver = "2"

[profile.capacity]
inherits = "release"
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
lto = "off"
codegen-units = 16

[workspace.dependencies]
agent-sdk = { path = "agent-sdk", version = "=0.1.0" }
provider-sdk = { path = "provider-sdk", version = "0.1.0" }
storage-sdk = { path = "storage-sdk", version = "0.1.0", default-features = false }
tool-sdk = { path = "tool-sdk", version = "0.1.0" }
base64 = "0.22"
bytes = "1.11"
futures-util = "0.3"
http = "1.4"
jsonschema = { version = "0.46", default-features = false }
reqwest = { version = "0.13", default-features = false }
secrecy = "0.10"
serde = "1.0"
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tokio = "1.51"
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
uuid = "1"
