  "External Rust dependencies resolve from crates.io without source patches or guard exemptions. Temporary advisory exceptions are individually enumerated; raw findings remain visible and new vulnerabilities or unsoundness remain blocking.",
  "Qdrant is temporarily absent from current features, public configuration and validation lanes. Historical backend results and security evidence retain their original source scope and authorize no current feature, patch or gate waiver.",
  "The 2026-10-29 Ollama repair records a supported same-ID artifact refresh, verified effective Tekken initialization, and ten passing confirmations of each of the two previously failing cases. Original failures remain immutable; unchanged historical long tests are reused under the maintainer's rule. This bounded affected-case pass does not claim a newly executed full Provider command or workspace wrapper.",
