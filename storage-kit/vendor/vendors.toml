  "bindings/rust/src",
  "bindings/rust/tests",
  "bindings/rust/examples",
  "core",
  "sync",
  "docs",
  "CHANGELOG.md",
  "Cargo.toml",
]
local_focus_paths = [
  "Cargo.lock",
  "storage-kit/Cargo.toml",
  "storage-kit/src/state_handle.rs",
  "storage-kit/src/state",
  "storage-kit/src/state_stores/sqlite",
  "storage-kit/tests",
  "storage-kit/README.md",
  "storage-kit/ARCHITECTURE.md",
]
plan_prompt_suffix = """Prioritize Rust binding and core transaction behavior drift between the current and target releases recorded in this dossier, keeping the dependency default features disabled and sync/experimental APIs outside the SQLite StateStore surface. For the incremental 0.8.1 to 0.8.2 update, verify the tagged comparison and published package metadata: the seven upstream commits change generated-column replay and column rename/drop during sync, exclusion of virtual columns from CDC update records, .NET database pooling, version-update tooling, and release versions. The Rust binding sources and feature definitions are unchanged; all nine Turso-family packages already present in the Storage graph publish 0.8.2, with unchanged dependency metadata apart from their family-version requirements. The shared core update emitter now uses stored-column offsets for CDC registers. Storage uses local memory/file databases (WAL for file mode), ordinary stored columns, and dedicated immediate transactions without CDC, generated columns, or sync; treat the absence of required production adaptation as an inference until existing public behavior passes on the target. Do not enable those upstream-only paths or expose new APIs merely to exercise the release. Preserve the completed 0.8.1 dossier and evidence; never retarget its frozen inputs. Reuse its existing meaningful actor, timeout, and memory/file strict cases as the baseline, extending tests only for a newly identified gap in retained behavior or an actual target regression. Review the resolved lock delta and package checksums, preserving all unrelated selected vendor versions. Inspect the target connection operation guard and Rows lifetime: batches acquire exclusive access and query rows retain shared access until exhaustion or drop. Verify existing dedicated actor connections and lexical row ownership through repeated operations, commit/rollback, cancellation, and memory/file reopen cases before considering any production change; do not add a new synchronization owner merely because the upstream guard exists. BusySnapshot predates both selected patch releases and is not by itself evidence for changing error mapping. Run the existing real slow-trigger 1 ms timeout regression unchanged against the target. If faster execution makes its 10,000-row stimulus insufficient, capture that actual failure and strengthen the real row-dependent workload while preserving the exact TimedOut result, bounded rollback join, and absent write after reopen; never relax the deadline or accept success as an alternate outcome. Preserve terminal authority, rollback-on-drop, primary errors, bounded admission, and tracked task ownership. Keep both default-lane SQLite memory/file strict cases and all distinct local actor regressions. Clean reopen proves ordinary persistence, not crash-before-checkpoint durability. Update PORTABLE_API.md's current Turso grounding to the selected source. Existing passing coverage closes a proof gap; do not manufacture a failure or introduce unrelated production changes. Plan meaningful public-behavior tests first; during leaf execution add or extend them and record actual red evidence before production adaptation, then run the focused native regressions and relevant compile/test checks for this vendor in its supported feature lanes. Return implementation and evidence ready for the updater: after leaf implementation, the updater runs target preflight and every exact manifest completion gate in the recorded order, all blocking under strict acceptance before cleanup, staging, and commit. Do not pre-run those whole-crate/workspace gates inside the leaf solely to duplicate the updater's unchanged immediate run; broaden or repeat checks when new changes, failures, or unresolved concerns justify them. This sequencing does not permit no-regression acceptance, skipped gates/cases, weakened assertions, or treating focused checks as completion. The parent still performs independent actual-diff review and the complete final campaign validation for every in-scope crate. Preserve supported feature lanes and limit fixes to sourced vendor drift."""
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--exclude", "app-kit", "--", "-D", "warnings"],
  ["bash", "storage-kit/scripts/check.sh"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source storage-kit/strict-tests.env && bash storage-kit/scripts/verify_strict_live.sh"],
]

