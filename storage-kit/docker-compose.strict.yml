services:
  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    command: ["start", "--user", "root", "--pass", "secret", "rocksdb:/home/nonroot/mydatabase.db"]
    ports:
      - "127.0.0.1:${TEST_SURREALDB_REMOTE_PORT:-8000}:8000"
    volumes:
      - surrealdb-state:/home/nonroot

  postgres:
    image: postgres:18.6-alpine3.24
    ports:
      - "127.0.0.1:${TEST_POSTGRES_STATE_STORE_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: storage_kit_state
      POSTGRES_USER: storage_kit
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-state:/var/lib/postgresql

volumes:
  surrealdb-state:
  postgres-state:
