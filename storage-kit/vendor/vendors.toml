plan_prompt_suffix = """Prioritize sourced SurrealDB 3.0.5 to 3.3.0 drift across the Rust Kit, matching core package, bundled server, and all five supported modes: memory, RocksDB, SurrealKV, HTTP, and WebSocket. Inspect the reorganized surrealdb tree and root Cargo.toml, including engine/local/api/rpc/types/sql/syn/idx/kvs/server ownership, without adding new direct split-package dependencies or features. Align the Kit/core/service and tracked environment example with the selected release. First add a real public create/open/list/scan/drop case for an sq-prefixed collection to expose the former sequence/table keyspace collision; run the old pins and report red only if observed. Add or strengthen exact filtered indexed-vector results, full-text removal after update and partition replacement, and concurrent first-use isolation for distinct namespace/database scopes with the same collection name; preserve scoped clone semantics and all retained operations. For canonical server readiness, change only Surreal's verifier probe from /health to unauthenticated /ready with no namespace/database headers: /ready is authoritative for completed startup and a fresh heartbeat, whereas /health only proves backend reachability. First adapt strict_env_contract endpoint/order expectations and add 503-to-200 readiness coverage, recording red against the old /health verifier and forbidding live selection before readiness. Preserve the already-fixed setup/stall-retry/child-settlement phase budgets, unchanged native curl connection/transfer limits, peer EOF, both full lanes, owned cleanup, and primary failure. Keep surreal_partition_deadline's /health route because the native Kit HTTP connect still uses it; update only its synthetic version response to the selected release. Keep deterministic codec/protocol evidence distinct from real strict-live proof, and update docs/testing.md for server startup readiness. Existing passing coverage closes a proof gap; do not manufacture a failure or introduce unrelated production changes. Plan meaningful public-behavior tests first; during leaf execution add or extend them and record actual red evidence before production adaptation, then run the focused native regressions and relevant compile/test checks for this vendor in its supported feature lanes. Return implementation and evidence ready for the updater: after leaf implementation, the updater runs target preflight and every exact manifest completion gate in the recorded order, all blocking under strict acceptance before cleanup, staging, and commit. Do not pre-run those whole-crate/workspace gates inside the leaf solely to duplicate the updater's unchanged immediate run; broaden or repeat checks when new changes, failures, or unresolved concerns justify them. This sequencing does not permit no-regression acceptance, skipped gates/cases, weakened assertions, or treating focused checks as completion. The parent still performs independent actual-diff review and the complete final campaign validation for every in-scope crate. Preserve supported feature lanes and limit fixes to sourced vendor drift."""
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--exclude", "app-kit", "--", "-D", "warnings"],
  ["bash", "storage-kit/scripts/check.sh"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source storage-kit/strict-tests.env && bash storage-kit/scripts/verify_strict_live.sh"],
]

