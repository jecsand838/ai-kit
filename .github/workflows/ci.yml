name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup show active-toolchain

      - name: Check formatting before native setup and cache transfer
        run: cargo fmt --all --check

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang libclang-dev cmake protobuf-compiler libprotobuf-dev \
            python3 pkg-config libssl-dev

      - name: Restore Cargo downloads and build outputs
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          # Bump v1 when changing artifact-affecting build settings, not timeouts/triggers.
          key: cargo-unified-v1-nodebug-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'provider-sdk/Cargo.toml', 'storage-sdk/Cargo.toml', 'tool-sdk/Cargo.toml', 'agent-sdk/Cargo.toml', 'app-sdk/Cargo.toml') }}
          restore-keys: |
            cargo-unified-v1-nodebug-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting, Clippy, and all public-trait mocks
        id: validation
        # Leave time for diagnostics after the CI runner is interrupted.
        timeout-minutes: 12
        run: bash scripts/check_ci.sh

      - name: Report build disk usage
        if: ${{ always() }}
        run: |
          df -h .
          if [ -d target/debug ]; then
            du -sh target/debug
          fi

      - name: Upload fresh CI reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/mock-contracts/
          retention-days: 7
          if-no-files-found: warn

      - name: Save Cargo cache after a successful cache miss
        if: ${{ success() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Preserve partial compilation after a failed cache miss
        # A bounded cold build may need another run. Cargo rechecks these outputs;
        # the failed run stays failed and test reports are never cached.
        if: >-
          ${{ failure() && !cancelled() && steps.validation.outcome == 'failure' &&
              steps.cargo-cache.outputs.cache-primary-key != '' &&
              steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
