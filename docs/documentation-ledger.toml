# These sets supplement the canonical entrypoints above. Paths are relative to
# the workspace; globs cover document families without duplicating their index.
# Active sets and explicitly named adopted-requirement files participate in
# existence and inline-file-link checks, without recursive historical traversal.
[document_sets]
active = [
  "provider-sdk/docs/providers/*.md",
  "agent-sdk/specs/codex/*.md",
  "agent-sdk/specs/opencode/*.md",
  "agent-sdk/specs/custom/*.md",
  "app-sdk/docs/*.md",
  ".agents/skills/*/SKILL.md",
  ".agents/skills/*/references/*.md",
  ".agents/skills/*/agents/openai.yaml",
  ".codex/agents/*.toml",
  "agent-sdk/.codex/development/PROCESS.md",
  "agent-sdk/.codex/development/dispatch/*.md",
]
historical = ["app-sdk/audits/**/*.md", "app-sdk/plans/**/*.md", "docs/refactors/**/*.md", "docs/pr20-pr21-integration.md", "docs/pr22-validation.md", "app-sdk/tests/fixtures/app-v6/README.md", "storage-sdk/tests/fixtures/README.md"]
templates = ["agent-sdk/.codex/development/templates/**/*.md", ".agents/skills/*/assets/**"]
excluded = ["tmp/**", "target/**", "**/vendor/**", "agent-sdk/.codex/development/execution/**"]
policy = "Historical records retain their original evidence; templates are examples, not active runs. Explicit adopted_requirements records preserve only the incorporated scope, not old phase instructions, draft signatures, commands, or completion claims. Ordinary links do not propagate adoption. Excluded artifacts are never traversed by documentation checks; pinned oracle authority comes only from the owning specification's explicit adoption. Selecting a workflow is explicit; its presence or adoption of frozen requirements does not activate an old campaign."

# These source-specific links identify private, locally retained evidence. Their
# absence in a clean checkout is permitted; this proves neither receipt
# availability nor qualification. Ordinary documentation links still must exist.
[[local_evidence_links]]
source = "storage-sdk/docs/feature-split-qualification.md"
target_prefix = "target/"

[[adopted_requirements]]
path = "app-sdk/plans/2026-09-13/COMPLETION_PLAN.md"
adopted_by = [
  "app-sdk/specs/SPECIFICATIONS.md",
  "app-sdk/specs/workflows/TESTING.md",
  "app-sdk/docs/STRICT_TESTING.md",
]
scope = "Approved semantic boundaries and exclusions, acceptance and independent-review obligations, and section 13 crash/performance workloads and proof requirements. Old commands, proposed target/API names, implementation chronology, baseline results, and section 15's executable goal prompt remain historical; adoption does not restart execution or establish a current pass."

[[adopted_requirements]]
path = "app-sdk/plans/2026-09-13/ACCEPTANCE_MATRIX.md"
adopted_by = [
  "app-sdk/specs/workflows/RESEARCH.md",
  "app-sdk/specs/workflows/TESTING.md",
  "app-sdk/docs/RURR_PARITY.md",
]
scope = "A01-A31 and C01-C12 observable outcomes and exclusions, acceptance protocol, binding/execution-mode proof, and integration/documentation acceptance. Dated source anchors and proposed API/test names do not supersede current owning specifications or validation commands; listed requirements are not evidence of implementation or passing tests."

[[adopted_requirements]]
path = "app-sdk/plans/2026-09-13/HISTORY_AND_CONTROLS.md"
adopted_by = ["app-sdk/plans/2026-09-13/COMPLETION_PLAN.md"]
scope = "Completion-plan section 10 explicitly adopts the observable history/control design outcomes in Decisions recommended for the completion plan and the twelve behavioral groups in Tests-first acceptance set. Current owning specifications govern signatures and translations; dated touchpoint tables and suggested private implementation spellings remain historical. This explicit incorporation does not adopt other linked proposals or execution instructions."

[[domains]]
name = "provider"
hierarchy = "Provider -> Model -> Session"
root_ingress = []
public_traits = ["ProviderBackend", "ModelBackend", "SessionBackend"]
supporting_modules = [
  "config",
  "generation",
  "embedding",
  "hosted",
  "files",
  "batch",
  "models",
  "session",
  "runtime",
  "error",
]

[[domains]]
name = "storage"
hierarchy = "Database; StateStore -> StateTransaction"
root_ingress = []
public_traits = ["DatabaseBackend", "StateStoreBackend", "StateTransactionBackend"]
supporting_modules = ["database::config", "database::catalog", "database::data", "database::query", "database::index", "state::config", "state::record", "state::transaction"]

[[domains]]
name = "tools"
hierarchy = "Toolset -> ToolHandler; independent McpServer"
root_ingress = ["Toolset::from_backend"]
public_traits = ["ToolsetBackend", "ToolHandlerBackend"]
supporting_modules = ["declaration", "execution", "interaction", "local", "mcp", "schema"]

[[domains]]
name = "agents"
hierarchy = "Agent -> Workspace -> Conversation"
root_ingress = []
public_traits = ["AgentBackend", "WorkspaceBackend", "ConversationBackend"]
supporting_modules = ["config", "identity", "workspace", "conversation", "prompt", "notification", "model", "tool", "knowledge", "error"]

[[domains]]
name = "applications"
hierarchy = "App -> Workspace -> Workflow -> WorkflowRun"
# App::open constructs App; it is not a backend normalization ingress.
root_ingress = []
public_traits = ["ActionBackend", "ConditionBackend", "StateTyping", "LifecycleHooks", "ChildExecutor"]
supporting_modules = ["workflow"]

[validation]
primary_ci_script = "scripts/check_ci.sh"
mock_contracts_script = "scripts/check_mock_contracts.sh"
runtime_qualification_script = "scripts/qualify_mock_runtime.py"
workspace_script = "scripts/verify_workspace_strict.sh"
release_qualification_script = "scripts/release_qualification.py"
release_evidence_script = "scripts/release_evidence.py"
release_import_script = "scripts/import_release_evidence.py"
docs_script = "scripts/check_docs_site.sh"
documentation_contract = "python3 -m unittest scripts.tests.test_documentation_contract"
path_guard = "scripts/check_no_path_wiring.sh"
alias_guard = "scripts/check_no_type_aliases.sh"
strict_scripts = [
  "agent-sdk/scripts/verify_strict_live.sh",
  "provider-sdk/scripts/verify_strict_live.sh",
  "storage-sdk/scripts/verify_strict_live.sh",
  "tool-sdk/scripts/verify_strict_live.sh",
  "app-sdk/scripts/verify_strict_live.sh",
]

[maintenance]
rule = "When a public hierarchy, functional module, validation command, or canonical document changes, update its owner documents and this compact ledger in the same change."
prohibited = "Do not append historical timelines, duplicate exact API inventories, or references to deleted compatibility surfaces."
