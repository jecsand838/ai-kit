[workspace]
members = ["agents-kit", "app-kit", "providers-kit", "storage-kit", "tools-kit"]
default-members = ["agents-kit", "app-kit", "providers-kit", "storage-kit", "tools-kit"]
resolver = "2"
[profile.capacity]
inherits = "release"
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
lto = "off"
codegen-units = 16

[workspace.dependencies]
agents-kit = { path = "agents-kit", version = "=0.0.1" }
providers-kit = { path = "providers-kit", version = "0.0.1" }
storage-kit = { path = "storage-kit", version = "0.0.1", default-features = false }
tools-kit = { path = "tools-kit", version = "0.0.1" }
base64 = "0.22"
bytes = "1.11"
futures-util = "0.3"
http = "1.4"
jsonschema = { version = "0.46", default-features = false }
reqwest = { version = "0.13", default-features = false }
secrecy = "0.10"
serde = "1.0"
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tokio = "1.54.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
uuid = "1"
