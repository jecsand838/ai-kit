[package]
name = "providers-kit"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "Portable enum-dispatch Kit over multiple model provider APIs."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "sdk", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "network-programming", "asynchronous"]
repository = "https://github.com/jecsand838/ai-kit"
documentation = "https://docs.rs/providers-kit"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "json", "multipart", "query", "rustls", "stream"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
