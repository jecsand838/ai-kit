  "The 2026-10-29 Provider follow-up records fixed Gemini and Ollama diagnostics, canonical private evidence retention, rejected scenario changes, and separately identified accepted historical long-test coverage. It preserves earlier receipts and does not convert native model failures into passing assertions.",
  "The 2026-10-28 strict-live repair reports preserve the original campaign and separately record affected-crate fixes, native comparisons, remaining failures and cleanup. The native follow-up records the user's acceptance of seven unchanged historical long-test passes; it does not relabel failed executions or establish workspace release qualification.",
