scope_source = "User-approved PR #22 documentation refresh on codex/public-trait-mock-ci, starting from d3b763e7; user-authorized release continuation from 9d99ddda with verified unchanged receipts; current owning specifications and explicit workspace contracts; prior user-approved PR #2 security remediation; user-approved contribution guide and GitHub templates; user-authorized initial 0.0.1 version alignment and pre-1.0 compatibility policy; user-authorized removal of source patches and temporary Qdrant removal, with explicit advisory risk acceptance; user-authorized crate and directory rename to agents-kit, providers-kit, app-kit, tools-kit and storage-kit; user-authorized manual main-only publishing with a one-time 0.0.1 qualification override; user-authorized removal of frozen v6 datasets and dependent tests; user-authorized README orientation cleanup and crate introduction refresh, with package version changes deferred; subsequent user-authorized 0.0.2 release preparation, without publication or a qualification waiver"
