[package]
name = "provider-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Portable enum-dispatch SDK over multiple model provider APIs."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "sdk", "openai", "anthropic", "gemini"]
categories = ["api-bindings", "network-programming", "asynchronous"]

[dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "json", "multipart", "query", "rustls", "stream"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
