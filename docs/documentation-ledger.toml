version = 7
scope_date = "2026-10-25"
scope_source = "User-approved PR #22 documentation refresh on codex/public-trait-mock-ci, starting from d3b763e7; user-authorized release continuation from 9d99ddda with verified unchanged receipts; current owning specifications and explicit workspace contracts"
notes = [
  "This ledger covers the five compiled SDK crates and their active repository-owned guidance.",
  "Generated rustdoc and immutable tmp artifacts are not authority. Historical documents and vendored material confer no authority merely by existing or being linked; owning specifications may explicitly adopt bounded requirements or pinned source semantics.",
  "App's owning specifications adopt the fixed rurr core oracle recorded in app-sdk/specs/workflows/RESEARCH.md. This does not authorize a vendor refresh, archive mutation, or broader public surface.",
  "The adopted_requirements records identify incorporated requirements inside dated documents; those documents retain historical provenance. Current owning specifications govern exact signatures and translations; current validation guides and scripts govern runnable commands.",
  "The active architecture has no public factory or conformance framework, LoopDriver, public KnowledgeBase backend, storage-to-tool adapter, or portable database realtime API.",
  "Toolset is the sole erased root ingress; provider, storage, and agent callers implement their public hierarchies directly.",
  "ModelBackend owns both its Session and Continuation associated types; Custom Agent keeps continuation prompt-local and durable history provider-neutral.",
  "Agent preserves direct ToolsetBackend and its associated Handler; App adds five workflow traits without widening lower-crate seams.",
  "Direct public-trait mocks are the primary deterministic lane; native integration and strict-live proof remain separate. Known defects and dated receipts never weaken release requirements.",
  "Active guidance describes contracts and required validation, not a claim that a particular checkout passed the release gates.",
  "The qualification report, prototype/capacity records and migration-fixture provenance retain their recorded source and results. Documentation edits do not relabel qualification; new integration results are recorded separately.",
]

