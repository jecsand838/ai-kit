version = 1

[vendors.codex]
repo = "openai/codex"
source_kind = "github-release-source"
channel = "stable"
release_tag_prefix = "rust-v"
archive_prefix = "codex"
upstream_focus_paths = [
  "codex-rs/app-server-protocol/src",
  "codex-rs/protocol/src",
  "codex-rs/app-server/src",
  "codex-rs/docs/protocol_v1.md",
]
local_focus_paths = [
  "agents-kit/src/backends/codex",
  "agents-kit/src/config/codex.rs",
  "agents-kit/tests/strict_live.rs",
  "agents-kit/tests/source_contract",
  "agents-kit/scripts/precheck_strict_live.sh",
  "agents-kit/scripts/verify_strict_live.sh",
  "agents-kit/strict-tests.env.example",
  "agents-kit/specs/SPECIFICATIONS.md",
  "agents-kit/specs/codex",
  "agents-kit/AGENTS.md",
  "agents-kit/ARCHITECTURE.md",
  "agents-kit/docs/STRICT_TESTING.md",
  ".agents/skills/agents-kit-research/references/live-validation.md",
]
plan_prompt_suffix = """Prioritize sourced protocol surface drift, request and approval flow changes, config updates, and strict-live coverage needed to keep the existing portable Codex API honest. Limit production and spec changes to facts changed by this vendor range plus mechanical cleanup in touched paths. Do not audit or implement unrelated agents-kit specification backlog, expose every new upstream operation, or add caller-facing Rust API."""
preflight_gates = [
  ["bash", "-lc", "source agents-kit/strict-tests.env && bash agents-kit/scripts/precheck_strict_live.sh"],
]
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--no-default-features", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--no-default-features", "--features", "redb,postgres,surrealdb,sqlite", "--", "-D", "warnings"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source agents-kit/strict-tests.env && bash agents-kit/scripts/verify_strict_live.sh"],
]

[vendors.opencode]
repo = "anomalyco/opencode"
source_kind = "github-release-source"
channel = "stable"
release_tag_prefix = "v"
archive_prefix = "opencode"
upstream_focus_paths = [
  "packages/sdk/openapi.json",
  "packages/docs/docs.json",
  ".opencode/opencode.jsonc",
  "README.md",
]
local_focus_paths = [
  "agents-kit/src/backends/opencode",
  "agents-kit/src/config/opencode.rs",
  "agents-kit/tests/strict_live.rs",
  "agents-kit/tests/source_contract",
  "agents-kit/scripts/precheck_strict_live.sh",
  "agents-kit/scripts/verify_strict_live.sh",
  "agents-kit/strict-tests.env.example",
  "agents-kit/opencode.json",
  "agents-kit/specs/SPECIFICATIONS.md",
  "agents-kit/specs/opencode",
  "agents-kit/AGENTS.md",
  "agents-kit/ARCHITECTURE.md",
  "agents-kit/docs/STRICT_TESTING.md",
  ".agents/skills/agents-kit-research/references/live-validation.md",
]
plan_prompt_suffix = """Prioritize sourced HTTP payload drift, session and prompt response shape changes, permission-policy regressions, and strict-live coverage needed to keep the existing portable OpenCode API honest. The generated OpenAPI artifact must remain primary evidence when it is unchanged. Limit production and spec changes to facts changed by this vendor range plus mechanical cleanup in touched paths. Do not audit or implement unrelated agents-kit specification backlog or add caller-facing Rust API."""
preflight_gates = [
  ["bash", "-lc", "source agents-kit/strict-tests.env && bash agents-kit/scripts/precheck_strict_live.sh"],
]
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--no-default-features", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "-p", "storage-kit", "--all-targets", "--no-default-features", "--features", "redb,postgres,surrealdb,sqlite", "--", "-D", "warnings"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source agents-kit/strict-tests.env && bash agents-kit/scripts/verify_strict_live.sh"],
]
