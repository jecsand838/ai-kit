version = 1

[vendors.lancedb]
repo = "lancedb/lancedb"
source_kind = "github-release-source"
channel = "stable"
release_tag_prefix = "v"
archive_prefix = "lancedb"
upstream_focus_paths = [
  "rust/lancedb/src",
  "rust/lancedb/tests",
  "rust/lancedb/examples",
  "docs/src",
]
local_focus_paths = [
  "Cargo.lock",
  "storage-kit/Cargo.toml",
  "storage-kit/tests/database_cases/mod.rs",
  "storage-kit/src/core/catalog/schema.rs",
  "storage-kit/docs/PORTABLE_API.md",
  "storage-kit/src/databases/lancedb",
  "storage-kit/src/databases/config/lance.rs",
  "storage-kit/tests/strict_live.rs",
]
plan_prompt_suffix = """Prioritize portable capability drift, embedded behavior changes, Rust Kit query and schema differences, and updates needed to keep the public storage surface honest around the canonical embedded Lance scope. For the incremental 0.39.0 to 0.40.0 release, verify the tagged and published Rust package graphs: the target uses Lance 13, Arrow 58, and a Rust 1.91 minimum, while this campaign retains its selected Rust 1.99 baseline and compatible Arrow 58 resolution. Preserve the existing Kit feature selection; review required transitive dependency and namespace-feature changes without adding direct dependencies or enabling new native-only behavior. Preserve the successful 0.39 dossier and its evidence; never retarget frozen inputs. Check the actual retained add_columns builder, SQL filter parsing, merge_insert partition replacement, query projections, schema validation, error mapping, and index lifecycle against the selected source. Reuse the current meaningful memory/filesystem catalog, data, schema, query, index, cancellation, and reopen coverage as baseline, adding tests only for demonstrated drift or a retained-behavior gap. Lance 13 changes deletion-aware scan limit/offset planning: add a bounded public scan regression in the existing DatabaseCase owner using multiple appends and deleted rows, verifying exact surviving records, cardinality, and duplicate-free pagination in memory and after all owners close and the filesystem database reopens. Respect the retained scan ordering contract; do not invent a portable ordering guarantee. Record an old-version green result honestly if this closes a coverage gap. Preserve eager SQL backfill via add_columns().transform(NewColumnTransform::SqlExpressions(...)).execute(), fail-before-mutation rejection of a present SQL read_columns option, and honest cast/nullability schema-evolution rejection unless target-native behavior proves a correction is warranted. Do not substitute deferred computed columns or force use_lsm(false). Keep the concrete Box::pin test-runner correction, existing timeout/runtime/cleanup ownership, and its limited selected-build stack claim. New OAuth, secrets, functions, materialized views, zonemap and other native index builders do not by themselves justify portable API additions or new adapters. Existing passing coverage closes a proof gap; do not manufacture failures or introduce unrelated production changes. Before any production correction, add or extend meaningful public-behavior tests and record actual target-version red evidence, then run affected focused cases in both supported Storage lanes. Return implementation and evidence ready for the updater: it owns target preflight, every exact strict completion gate, artifact cleanup, lock finalization, scoped staging and commit. Do not pre-run the same whole-crate/workspace gates solely to duplicate the updater's immediate unchanged run; broaden or repeat checks when new changes, failures, or unresolved concerns justify them. No filters, skipped cases, weaker assertions or historical partial passes replace complete vendor and final campaign validation. Preserve tight public boundaries and limit fixes to sourced release drift."""
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--exclude", "app-kit", "--", "-D", "warnings"],
  ["bash", "storage-kit/scripts/check.sh"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source storage-kit/strict-tests.env && bash storage-kit/scripts/verify_strict_live.sh"],
]

