duction change; do not add a new synchronization owner merely because the upstream guard exists. BusySnapshot predates both selected patch releases and is not by itself evidence for changing error mapping. Run the existing real slow-trigger 1 ms timeout regression unchanged against the target. If faster execution makes its 10,000-row stimulus insufficient, capture that actual failure and strengthen the real row-dependent workload while preserving the exact TimedOut result, bounded rollback join, and absent write after reopen; never relax the deadline or accept success as an alternate outcome. Preserve terminal authority, rollback-on-drop, primary errors, bounded admission, and tracked task ownership. Keep both default-lane SQLite memory/file strict cases and all distinct local actor regressions. Clean reopen proves ordinary persistence, not crash-before-checkpoint durability. Update PORTABLE_API.md's current Turso grounding to the selected source. Existing passing coverage closes a proof gap; do not manufacture a failure or introduce unrelated production changes. Plan meaningful public-behavior tests first; during leaf execution add or extend them and record actual red evidence before production adaptation, then run the focused native regressions and relevant compile/test checks for this vendor in its supported feature lanes. Return implementation and evidence ready for the updater: after leaf implementation, the updater runs target preflight and every exact manifest completion gate in the recorded order, all blocking under strict acceptance before cleanup, staging, and commit. Do not pre-run those whole-crate/workspace gates inside the leaf solely to duplicate the updater's unchanged immediate run; broaden or repeat checks when new changes, failures, or unresolved concerns justify them. This sequencing does not permit no-regression acceptance, skipped gates/cases, weakened assertions, or treating focused checks as completion. The parent still performs independent actual-diff review and the complete final campaign validation for every in-scope crate. Preserve supported feature lanes and limit fixes to sourced vendor drift."""
completion_gates = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--exclude", "storage-kit", "--exclude", "app-kit", "--", "-D", "warnings"],
  ["bash", "storage-kit/scripts/check.sh"],
  ["bash", "scripts/check_docs_site.sh"],
  ["bash", "-lc", "source storage-kit/strict-tests.env && bash storage-kit/scripts/verify_strict_live.sh"],
]

